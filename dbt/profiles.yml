chile_road_safety:
  target: dev

  outputs:
    dev:
      type: postgres
      host: 127.0.0.1
      port: 5433
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 2

    bigquery:
      type: bigquery
      method: oauth
      project: chile-road-safety-pipeline
      dataset: road_safety_analytics
      location: US
      threads: 2
      priority: interactive